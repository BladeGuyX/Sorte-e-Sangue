<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícone do Sorte & Sangue: trevo (sorte) e gota (sangue) sobre um fundo escuro com borda dourada -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3b2554"/>
      <stop offset="1" stop-color="#0c0910"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3a1"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <radialGradient id="leaf" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#9dffb0"/>
      <stop offset="1" stop-color="#2f9a4b"/>
    </radialGradient>
    <radialGradient id="blood" cx="38%" cy="40%" r="70%">
      <stop offset="0" stop-color="#ff7a85"/>
      <stop offset="1" stop-color="#a8121f"/>
    </radialGradient>
  </defs>
  <rect id="fundo" width="512" height="512" rx="112" fill="url(#bg)"/>
  <g id="arte">
    <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <!-- trevo -->
    <g transform="translate(205 205)">
      <path d="M0 10 L44 150" stroke="#1d6a32" stroke-width="16" stroke-linecap="round"/>
      <circle cx="0" cy="-62" r="62" fill="url(#leaf)"/>
      <circle cx="-62" cy="0" r="62" fill="url(#leaf)"/>
      <circle cx="62" cy="0" r="62" fill="url(#leaf)"/>
      <circle cx="0" cy="62" r="62" fill="url(#leaf)"/>
      <circle cx="0" cy="0" r="20" fill="#2f9a4b"/>
    </g>
    <!-- gota -->
    <g transform="translate(340 318)">
      <path d="M0 -118 C0 -118 -82 -10 -82 48 A82 82 0 0 0 82 48 C82 -10 0 -118 0 -118 Z" fill="url(#blood)" stroke="#2a0306" stroke-width="10"/>
      <path d="M-40 52 A40 40 0 0 0 -8 92" stroke="rgba(255,255,255,.6)" stroke-width="12" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
