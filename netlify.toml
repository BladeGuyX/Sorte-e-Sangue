# Configuração do Netlify: roda o build e publica a pasta dist/
[build]
  command = "node build.js"
  publish = "dist"

# a página sempre é conferida de novo (para pegar a versão nova logo após um deploy)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# .js e .css têm hash no nome, então podem ficar em cache para sempre
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
